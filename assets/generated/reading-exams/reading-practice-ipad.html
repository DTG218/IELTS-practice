<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IELTS 阅读练习 - iPad</title>
  <style>html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#fff}#exam{display:block;width:100%;height:100%;border:0}#touch-tip{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:99999;background:rgba(20,20,20,.88);color:#fff;padding:8px 12px;border-radius:8px;font:14px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;pointer-events:none;opacity:0;transition:opacity .18s;white-space:nowrap}#touch-tip.show{opacity:1}</style>
</head>
<body>
<iframe id="exam" title="IELTS Reading"></iframe><div id="touch-tip"></div>
<script>
(function(){'use strict';
const frame=document.getElementById('exam'),tip=document.getElementById('touch-tip'),params=new URLSearchParams(location.search),examId=params.get('examId')||'',dataKey=params.get('dataKey')||examId,token=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),sessionId='ipad-'+token;
const inner=new URL('./reading-practice-unified.html',location.href);if(examId)inner.searchParams.set('examId',examId);if(dataKey)inner.searchParams.set('dataKey',dataKey);frame.src=inner.href;
function showTip(text){tip.textContent=text;tip.classList.add('show');clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.classList.remove('show'),1600)}
function send(type,data){if(!frame.contentWindow)return;frame.contentWindow.postMessage({type,source:'exam_host',data:Object.assign({examId,sessionId,practiceMode:'single',parentOrigin:location.origin,windowSessionToken:token,windowSessionGeneration:1,messageIssuedAtMs:Date.now()},data||{})},location.origin)}
addEventListener('message',function(e){if(e.source!==frame.contentWindow||e.origin!==location.origin)return;const msg=e.data||{},data=msg.data||{};if(msg.source!=='practice_page')return;if(msg.type==='REQUEST_INIT')send('INIT_SESSION',{examId:data.examId||examId});else if(msg.type==='PRACTICE_COMPLETE')send('PRACTICE_SUBMIT_ACK',{examId:data.examId||examId,submissionId:data.submissionId,sessionId})});
function installTouchAssist(){let d;try{d=frame.contentDocument}catch(_){return}if(!d||d.documentElement.dataset.ipadAssist==='1')return;d.documentElement.dataset.ipadAssist='1';const style=d.createElement('style');style.textContent='.ipad-selected-option{outline:3px solid #418fc6!important;outline-offset:2px!important}.paragraph-dropzone,.match-dropzone,.drop-target-summary,.drag-item,.draggable-word,.card{touch-action:manipulation}';d.head.appendChild(style);let selected=null;const itemSelector='.drag-item,.draggable-word,.card',zoneSelector='.paragraph-dropzone,.match-dropzone,.drop-target-summary',poolSelector='.pool-items,#word-options,.options-pool,.option-pool,.cardpool,.headings-pool,.pool';
function payload(item){return{value:item.dataset.heading||item.dataset.option||item.dataset.key||item.dataset.word||item.dataset.value||item.dataset.answerValue||item.textContent.trim(),label:item.dataset.answerLabel||item.dataset.word||item.dataset.value||item.textContent.trim()}}
function clearSelected(){if(selected)selected.classList.remove('ipad-selected-option');selected=null}
function assign(zone,item){if(!zone||!item)return;const p=payload(item);if(!p.value)return;const old=String(zone.dataset.answerValue||'').trim();if(old)d.querySelectorAll(itemSelector).forEach(x=>{const xp=payload(x);if(xp.value===old&&x.dataset.consumed==='1'){delete x.dataset.consumed;x.classList.remove('option-consumed');x.setAttribute('draggable','true')}});zone.dataset.answerValue=p.value;zone.dataset.answerLabel=p.label;zone.classList.add('dropzone-filled');zone.classList.remove('dropzone-empty','correct','wrong');let holder=zone.classList.contains('drop-target-summary')?zone:zone.querySelector('.dropped-items');if(!holder&&!zone.classList.contains('drop-target-summary')){holder=d.createElement('div');holder.className='dropped-items';zone.appendChild(holder)}if(holder){holder.innerHTML='';const n=d.createElement('div');n.className='drag-item drag-item--assigned';n.textContent=p.label;n.dataset.answerValue=p.value;n.dataset.answerLabel=p.label;n.setAttribute('draggable','true');holder.appendChild(n)}const group=zone.closest('.unified-group')||d.querySelector('.unified-group[data-allow-option-reuse="false"]');if(group&&group.dataset.allowOptionReuse==='false'&&!item.classList.contains('drag-item--assigned')){item.dataset.consumed='1';item.classList.add('option-consumed');item.setAttribute('draggable','false')}zone.dispatchEvent(new Event('input',{bubbles:true}));zone.dispatchEvent(new Event('change',{bubbles:true}));clearSelected();showTip('已放入答案框')}
d.addEventListener('click',function(e){const item=e.target.closest&&e.target.closest(itemSelector),zone=e.target.closest&&e.target.closest(zoneSelector),pool=e.target.closest&&e.target.closest(poolSelector);if(item&&!item.classList.contains('option-consumed')){if(item.classList.contains('drag-item--assigned'))return;e.preventDefault();e.stopPropagation();clearSelected();selected=item;item.classList.add('ipad-selected-option');showTip('已选择，点一下要放入的答案框');return}if(zone&&selected){e.preventDefault();e.stopPropagation();assign(zone,selected);return}if(pool&&selected)clearSelected()},true);showTip('iPad模式：拖拽题可“点选项 → 点答案框”')}
frame.addEventListener('load',function(){setTimeout(installTouchAssist,400);setTimeout(installTouchAssist,1500)})})();
</script></body></html>
